<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 24px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; }
  .swatch { aspect-ratio: 4/5; border-radius: 10px; display:flex; flex-direction:column; justify-content:space-between; padding: 10px 12px; color: #fff; box-shadow: inset 0 0 0 1px rgba(0,0,0,.04); }
  .swatch .role { font-size: 11px; font-weight: 600; opacity: .9; letter-spacing: .02em; }
  .swatch .hex { font-family: var(--font-mono); font-size: 11px; opacity: .85; }
</style></head><body>
  <div class="swatch" style="background:#3B82F6;"><div class="role">chart-1 · Blue</div><div class="hex">3B82F6</div></div>
  <div class="swatch" style="background:#10B981;"><div class="role">chart-2 · Green</div><div class="hex">10B981</div></div>
  <div class="swatch" style="background:#F59E0B;"><div class="role">chart-3 · Amber</div><div class="hex">F59E0B</div></div>
  <div class="swatch" style="background:#EF4444;"><div class="role">chart-4 · Red</div><div class="hex">EF4444</div></div>
  <div class="swatch" style="background:#8B5CF6;"><div class="role">chart-5 · Violet</div><div class="hex">8B5CF6</div></div>
  <div class="swatch" style="background:#14B8A6;"><div class="role">chart-6 · Teal</div><div class="hex">14B8A6</div></div>
  <div class="swatch" style="background:#06B6D4;"><div class="role">chart-7 · Cyan</div><div class="hex">06B6D4</div></div>
</body></html>
