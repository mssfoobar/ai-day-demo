<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 24px; }
  .scale { display: grid; grid-template-columns: repeat(11, 1fr); border-radius: 8px; overflow: hidden; border: 1px solid rgba(0,0,0,.06); }
  .step { aspect-ratio: 1/1; display: flex; flex-direction: column; justify-content: space-between; padding: 6px 8px; font-family: var(--font-mono); font-size: 10px; }
  .step .n { opacity: .65; }
  .label { font-family: var(--font-mono); font-size: 11px; color: var(--zinc-500); margin-bottom: 8px; letter-spacing: .04em; text-transform: uppercase; }
</style></head><body>
  <div class="label">zinc · primary neutral</div>
  <div class="scale">
    <div class="step" style="background:#FAFAFA; color:#52525B;"><span class="n">50</span><span>FAFAFA</span></div>
    <div class="step" style="background:#F4F4F5; color:#52525B;"><span class="n">100</span><span>F4F4F5</span></div>
    <div class="step" style="background:#E4E4E7; color:#52525B;"><span class="n">200</span><span>E4E4E7</span></div>
    <div class="step" style="background:#D4D4D8; color:#3F3F46;"><span class="n">300</span><span>D4D4D8</span></div>
    <div class="step" style="background:#A1A1AA; color:#fff;"><span class="n">400</span><span>A1A1AA</span></div>
    <div class="step" style="background:#71717A; color:#fff;"><span class="n">500</span><span>71717A</span></div>
    <div class="step" style="background:#52525B; color:#fff;"><span class="n">600</span><span>52525B</span></div>
    <div class="step" style="background:#3F3F46; color:#fff;"><span class="n">700</span><span>3F3F46</span></div>
    <div class="step" style="background:#27272A; color:#fff;"><span class="n">800</span><span>27272A</span></div>
    <div class="step" style="background:#18181B; color:#fff;"><span class="n">900</span><span>18181B</span></div>
    <div class="step" style="background:#09090B; color:#fff;"><span class="n">950</span><span>09090B</span></div>
  </div>
</body></html>
