<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_table.css">
<style>
  .pag { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border: 1px solid #E4E4E7; border-radius: 8px; background: #fff; font-size: 14px; color: #71717A; font-family: Geist, var(--font-body); margin-bottom: 14px; }
  .pag .pages { display: inline-flex; gap: 4px; }
  .pag .pg { width: 32px; height: 32px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid #E4E4E7; background: #fff; color: #18181B; font-size: 13px; }
  .pag .pg.active { background: #0369A1; color: #fff; border-color: #0369A1; }
  .pag .pg.disabled { color: #A1A1AA; cursor: not-allowed; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: #71717A; margin-top: -8px; margin-bottom: 12px; }
</style></head>
<body>
  <div class="label">Pagination · Figma /Data-table/Pagination-V2</div>

  <div class="meta">Many pages — page 2 active, prev disabled</div>
  <div class="pag">
    <span>Showing 21 – 40 of 140</span>
    <div class="pages">
      <span class="pg disabled"><svg class="ico-sm" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></span>
      <span class="pg">1</span>
      <span class="pg active">2</span>
      <span class="pg">3</span>
      <span class="pg">4</span>
      <span class="pg"><svg class="ico-sm" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></span>
    </div>
  </div>

  <div class="meta">Single page — only count shown</div>
  <div class="pag" style="justify-content:flex-end;">
    <span>Showing 1 – 10 of 10</span>
  </div>
</body></html>
