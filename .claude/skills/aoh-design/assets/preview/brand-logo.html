<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 0; display: grid; grid-template-columns: 1fr 1fr; height: 280px; }
  .light, .dark { display: flex; align-items: center; justify-content: center; padding: 24px; }
  .light { background: #FFFFFF; border-right: 1px solid #E4E4E7; }
  .dark  { background: #18181B; }
  img { max-width: 200px; max-height: 140px; object-fit: contain; }
</style></head><body>
  <div class="light"><img src="../assets/agil-logo.png" alt="AGIL"></div>
  <div class="dark"><img src="../assets/agil-logo.png" alt="AGIL" style="filter: invert(1) hue-rotate(180deg) brightness(1.2);"></div>
</body></html>
