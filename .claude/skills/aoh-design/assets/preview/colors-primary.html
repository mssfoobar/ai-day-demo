<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 24px; display: grid; grid-template-columns: 220px 1fr; gap: 20px; align-items: stretch; }
  .hero { background: #0369A1; color: #fff; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
  .hero .role { font-size: 13px; font-weight: 600; opacity: .85; letter-spacing: .02em; }
  .hero .hex  { font-family: var(--font-mono); font-size: 24px; font-weight: 600; }
  .hero .nm   { font-family: var(--font-mono); font-size: 12px; opacity: .8; }
  .scale { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
  .step { border-radius: 6px; padding: 10px 8px; display: flex; flex-direction: column; justify-content: space-between; font-family: var(--font-mono); font-size: 10px; min-height: 88px; }
  .step .n { opacity: .7; }
</style></head><body>
  <div class="hero">
    <div>
      <div class="role">--primary</div>
      <div class="nm" style="opacity:.7">sky-700 · ring uses sky-600</div>
    </div>
    <div class="hex">#0369A1</div>
  </div>
  <div class="scale">
    <div class="step" style="background:#F0F9FF; color:#075985;"><span class="n">50</span><span>F0F9FF</span></div>
    <div class="step" style="background:#E0F2FE; color:#075985;"><span class="n">100</span><span>E0F2FE</span></div>
    <div class="step" style="background:#BAE6FD; color:#075985;"><span class="n">200</span><span>BAE6FD</span></div>
    <div class="step" style="background:#38BDF8; color:#fff;"><span class="n">400</span><span>38BDF8</span></div>
    <div class="step" style="background:#0EA5E9; color:#fff;"><span class="n">500</span><span>0EA5E9</span></div>
    <div class="step" style="background:#0284C7; color:#fff;"><span class="n">600 · ring</span><span>0284C7</span></div>
    <div class="step" style="background:#0369A1; color:#fff; box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 4px #0369A1;"><span class="n">700 · primary</span><span>0369A1</span></div>
    <div class="step" style="background:#075985; color:#fff;"><span class="n">800</span><span>075985</span></div>
  </div>
</body></html>
