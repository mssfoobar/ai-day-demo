<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 24px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .tile { border: 1px solid var(--zinc-200); border-radius: 8px; overflow: hidden; }
  .tile .swatch { height: 64px; }
  .tile .meta { padding: 8px 10px; }
  .tile .name { font-family: var(--font-mono); font-size: 11px; color: var(--zinc-900); }
  .tile .val  { font-family: var(--font-mono); font-size: 10px; color: var(--zinc-500); margin-top: 2px; }
</style></head><body>
  <div class="grid">
    <div class="tile"><div class="swatch" style="background:#FFFFFF; box-shadow: inset 0 0 0 1px var(--zinc-200);"></div><div class="meta"><div class="name">--background</div><div class="val">#FFFFFF</div></div></div>
    <div class="tile"><div class="swatch" style="background:#09090B;"></div><div class="meta"><div class="name">--foreground</div><div class="val">#09090B</div></div></div>
    <div class="tile"><div class="swatch" style="background:#0369A1;"></div><div class="meta"><div class="name">--primary</div><div class="val">#0369A1 · sky-700</div></div></div>
    <div class="tile"><div class="swatch" style="background:#F4F4F5;"></div><div class="meta"><div class="name">--secondary</div><div class="val">#F4F4F5</div></div></div>
    <div class="tile"><div class="swatch" style="background:#F4F4F5;"></div><div class="meta"><div class="name">--muted</div><div class="val">#F4F4F5</div></div></div>
    <div class="tile"><div class="swatch" style="background:#71717A;"></div><div class="meta"><div class="name">--muted-foreground</div><div class="val">#71717A</div></div></div>
    <div class="tile"><div class="swatch" style="background:#DC2626;"></div><div class="meta"><div class="name">--destructive</div><div class="val">#DC2626</div></div></div>
    <div class="tile"><div class="swatch" style="background:#E4E4E7;"></div><div class="meta"><div class="name">--border</div><div class="val">#E4E4E7</div></div></div>
  </div>
</body></html>
