<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 24px; }
  .scale { display: grid; grid-template-columns: repeat(11, 1fr); border-radius: 8px; overflow: hidden; border: 1px solid rgba(0,0,0,.06); }
  .step { aspect-ratio: 1/1; display: flex; flex-direction: column; justify-content: space-between; padding: 6px 8px; font-family: var(--font-mono); font-size: 10px; }
  .step .n { opacity: .65; }
  .label { font-family: var(--font-mono); font-size: 11px; color: var(--zinc-500); margin-bottom: 8px; letter-spacing: .04em; text-transform: uppercase; }
</style></head><body>
  <div class="label">slate · canvas / surface backgrounds</div>
  <div class="scale">
    <div class="step" style="background:#F8FAFC; color:#475569;"><span class="n">50</span><span>F8FAFC</span></div>
    <div class="step" style="background:#F1F5F9; color:#475569;"><span class="n">100</span><span>F1F5F9</span></div>
    <div class="step" style="background:#E2E8F0; color:#475569;"><span class="n">200</span><span>E2E8F0</span></div>
    <div class="step" style="background:#CBD5E1; color:#334155;"><span class="n">300</span><span>CBD5E1</span></div>
    <div class="step" style="background:#94A3B8; color:#fff;"><span class="n">400</span><span>94A3B8</span></div>
    <div class="step" style="background:#64748B; color:#fff;"><span class="n">500</span><span>64748B</span></div>
    <div class="step" style="background:#475569; color:#fff;"><span class="n">600</span><span>475569</span></div>
    <div class="step" style="background:#334155; color:#fff;"><span class="n">700</span><span>334155</span></div>
    <div class="step" style="background:#1E293B; color:#fff;"><span class="n">800</span><span>1E293B</span></div>
    <div class="step" style="background:#0F172A; color:#fff;"><span class="n">900</span><span>0F172A</span></div>
    <div class="step" style="background:#020617; color:#fff;"><span class="n">950</span><span>020617</span></div>
  </div>
</body></html>
