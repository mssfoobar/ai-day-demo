<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .label { font-size: 14px; font-weight: 500; color: #18181B; }
  .input { height: 36px; border-radius: 6px; border: 1px solid #E4E4E7; background: #fff; padding: 0 12px; font-family: var(--font-body); font-size: 14px; color: #09090B; box-shadow: 0 1px 2px 0 rgba(16,24,40,.05); display: flex; align-items: center; gap: 8px; }
  .input.focus { border-color: #3B82F6; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
  .input.error { border-color: #DC2626; }
  .placeholder { color: #A1A1AA; }
  .hint { font-size: 12px; color: #71717A; }
  .err  { font-size: 12px; color: #DC2626; }
  .ico { width: 16px; height: 16px; stroke: #71717A; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style></head><body>
  <div class="field">
    <div class="label">Name</div>
    <div class="input">Distribution List 1</div>
    <div class="hint">Will be visible to all channel members.</div>
  </div>
  <div class="field">
    <div class="label">Search</div>
    <div class="input"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span class="placeholder">Search lists…</span></div>
  </div>
  <div class="field">
    <div class="label">Email</div>
    <div class="input focus">ops@agil.example</div>
    <div class="hint">Focused state — 3 px blue ring.</div>
  </div>
  <div class="field">
    <div class="label">Priority</div>
    <div class="input error">P0 — invalid</div>
    <div class="err">Priority must be P1–P4.</div>
  </div>
</body></html>
