<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 28px; display: flex; gap: 28px; align-items: flex-end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 96px; height: 64px; background: #F4F4F5; border: 1px solid var(--zinc-200); }
  .label { font-family: var(--font-mono); font-size: 11px; color: var(--zinc-700); text-align: center; }
  .use { font-family: var(--font-body); font-size: 11px; color: var(--zinc-500); text-align: center; }
</style></head><body>
  <div class="item"><div class="box" style="border-radius:4px;"></div><div class="label">radius-xs · 4</div><div class="use">tags, dots</div></div>
  <div class="item"><div class="box" style="border-radius:6px;"></div><div class="label">radius-sm · 6</div><div class="use">buttons, inputs</div></div>
  <div class="item"><div class="box" style="border-radius:8px;"></div><div class="label">radius-md · 8</div><div class="use">cards, modals</div></div>
  <div class="item"><div class="box" style="border-radius:12px;"></div><div class="label">radius-lg · 12</div><div class="use">widgets</div></div>
  <div class="item"><div class="box" style="border-radius:16px;"></div><div class="label">radius-xl · 16</div><div class="use">big containers</div></div>
  <div class="item"><div class="box" style="border-radius:999px;"></div><div class="label">full</div><div class="use">pills, avatars</div></div>
</body></html>
