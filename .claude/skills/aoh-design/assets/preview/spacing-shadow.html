<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 36px 28px; display: flex; gap: 28px; background: #FAFAFA; align-items: center; }
  .card { width: 120px; height: 88px; background: #fff; border-radius: 10px; border: 1px solid var(--zinc-200); display: flex; flex-direction: column; justify-content: space-between; padding: 10px 12px; }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--zinc-700); }
  .use  { font-family: var(--font-body); font-size: 11px; color: var(--zinc-500); }
</style></head><body>
  <div class="card" style="box-shadow: 0 1px 2px 0 rgba(16,24,40,.05);"><div class="name">shadow-sm</div><div class="use">inputs, low cards</div></div>
  <div class="card" style="box-shadow: 0 1px 3px 0 rgba(0,0,0,.1), 0 1px 2px -1px rgba(0,0,0,.1);"><div class="name">shadow-md</div><div class="use">widgets default</div></div>
  <div class="card" style="box-shadow: 0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -2px rgba(0,0,0,.1);"><div class="name">shadow-lg</div><div class="use">hover, popovers</div></div>
  <div class="card" style="box-shadow: 0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -2px rgba(0,0,0,.05);"><div class="name">shadow-xl</div><div class="use">modal, tooltip</div></div>
</body></html>
