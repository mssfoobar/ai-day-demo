<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 28px 32px; display:flex; gap: 40px; align-items: flex-end; }
  .item { display: flex; flex-direction: column; gap: 6px; }
  .label { font-family: var(--font-mono); font-size: 11px; color: var(--zinc-500); }
  .lg { font-family: var(--font-display); font-weight: 700; font-size: 32px; line-height: 38px; font-variant-numeric: tabular-nums; }
  .md { font-family: var(--font-display); font-weight: 600; font-size: 24px; line-height: 31px; font-variant-numeric: tabular-nums; }
  .table-h { font-family: var(--font-body); font-weight: 600; font-size: 12px; line-height: 18px; color: var(--muted-foreground); text-transform: uppercase; letter-spacing: .05em; }
  .table-c { font-family: var(--font-body); font-size: 14px; line-height: 21px; font-variant-numeric: tabular-nums; }
</style></head><body>
  <div class="item">
    <div class="label">metric · 32/38 · Geist 700</div>
    <div class="lg">2,847</div>
  </div>
  <div class="item">
    <div class="label">metric-md · 24/31 · Geist 600</div>
    <div class="md">+18.4%</div>
  </div>
  <div class="item" style="gap:2px;">
    <div class="label">table-h · 12/18 · 600 · UPPER</div>
    <div class="table-h">Last modified</div>
    <div class="table-c">12/12/2024 12:00:00</div>
    <div class="table-c">04/29/2024 09:13:22</div>
  </div>
</body></html>
