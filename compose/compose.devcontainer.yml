# Devcontainer overlay: the workshop container beside the database.
#
# Layered on compose.yml, never used alone:
#   podman compose -f compose/compose.yml -f compose/compose.devcontainer.yml up -d

services:
  workshop:
    # Prebuilt and public, so this pulls rather than builds. `build` is the fallback
    # when the tag is unavailable; it needs network, not a token.
    image: ghcr.io/mssfoobar/ai-day-workshop:0.1.0
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    container_name: dispatch-workshop
    # Keeps the container alive to attach to.
    command: sleep infinity
    environment:
      # Postgres is a sibling container here, not localhost as it is for a native run.
      SQL_HOST: postgres
    volumes:
      - ..:/workspace:cached
    ports:
      - "${WEB_PORT:-5173}:5173"
      - "${SVC_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
