name: aoh

# The single entry point for the stack. The files below no longer include one another:
# podman-compose concatenates list fields when a file is included twice, which corrupts
# any healthcheck or ports block it reaches. Run a subset from here instead, and
# depends_on pulls in the rest:
#
#     podman compose up -d gis-service
#
# Host paths in the included files are written `${COMPOSE_PROJECT_DIR:-..}/<dir>/...`,
# because the two compose providers resolve a relative path in an included file
# differently: docker-compose against that file's own directory, podman-compose against
# this one. podman-compose sets COMPOSE_PROJECT_DIR to this directory; docker-compose
# leaves it unset, and the `..` fallback climbs from the included file back to here.
# A plain `./` path works under one provider and yields an empty mount under the other.
#
include:
    - ./traefik/compose.yml
    - ./iams/compose.yml
    - ./sds/compose.yml
    - ./otel/compose.yml
    - ./rtus/compose.yml
    - ./gis/compose.yml
    - ./dispatch/compose.yml
    - ./dispatch-svc/compose.yml
    - ./dispatch-web/compose.yml
