name: aoh

# The single entry point for the stack. The files below no longer include one another:
# podman-compose concatenates list fields when a file is included twice, which corrupts
# any healthcheck or ports block it reaches. Run a subset from here instead, and
# depends_on pulls in the rest:
#
#     podman compose up -d gis-service
#
include:
    - ./traefik/compose.yml
    - ./iams/compose.yml
    - ./sds/compose.yml
    - ./otel/compose.yml
    - ./rtus/compose.yml
    - ./gis/compose.yml
    - ./dispatch/compose.yml
    - ./dispatch-svc/compose.yml
    - ./dispatch-web/compose.yml
