# Compose entry for a Go service under `apps/dispatch-svc/`.
# Replace `dispatch-svc` placeholders with the actual app name; `DISPATCH_SVC` is the same
# uppercased with `-` → `_` (e.g. `incident-svc` → `INCIDENT_SVC`).
# For the native-dev vs container-packaging workflow + the `podman build`
# incantation, see `aoh-compose` SKILL.md → "Verify".

name: aoh

include:
    - ../traefik/compose.yml
    - ../iams/compose.yml

services:
    dispatch-svc:
        # `profiles: [apps]` matches the Turborepo `apps/dispatch-svc/` convention.
        # Bare `compose up` brings up infra only — apps/* services are not
        # implicitly pulled (their `:local` image only exists after
        # `podman build`). Normal dev runs the service natively
        # (`go run ./cmd/server`) against composed-up infra. To test the
        # packaged image:
        #   podman compose --profile apps up -d dispatch-svc
        profiles: [apps]
        image: dispatch-svc:${DISPATCH_SVC_TAG:-local}
        restart: on-failure
        environment:
            # --- Core ---
            LOG_LEVEL: info
            HTTP_PORT: 8080
            # --- Observability (OpenTelemetry) ---
            # Export to the core gateway collector (aoh-golib/otel reads these);
            # a no-op in the SDK when the endpoint is unset.
            OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
            OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
            # --- IAMS / Keycloak ---
            # aoh-go-init services use Docker DNS; the iams compose sets
            # KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true so this resolves correctly.
            IAMS_KEYCLOAK_HOST: http://iams-keycloak
            IAMS_KEYCLOAK_PORT: 8080
            IAMS_KEYCLOAK_REALM: aoh
            # Uncomment if you added a confidential Keycloak client for this service:
            # IAMS_KEYCLOAK_CLIENT_ID: dispatch-svc
            # IAMS_KEYCLOAK_CLIENT_SECRET: ${DEV_PASSWORD}
            # --- Database (uncomment with the dispatch-svc-db block below if needed) ---
            # SQL_HOST: dispatch-svc-db
            # SQL_PORT: 5432
            # SQL_USER: ${DEV_USER}
            # SQL_PASSWORD: ${DEV_PASSWORD}
            # SQL_DATABASE_NAME: dispatch-svc
            # SQL_SCHEMA_NAME: public
            # SQL_SSL_MODE: disable
        depends_on:
            iams-keycloak:
                condition: service_healthy
            # Uncomment with the dispatch-svc-db block below:
            # dispatch-svc-db:
            #     condition: service_healthy
        labels:
            - traefik.enable=true
            - traefik.http.routers.dispatch-svc.rule=Host(`dispatch-svc.${DEV_DOMAIN}`)
            - traefik.http.routers.dispatch-svc.entrypoints=web
            - traefik.http.routers.dispatch-svc.middlewares=permissive-headers@docker
            - traefik.http.services.dispatch-svc.loadbalancer.server.port=8080

    # --- Database (optional) ---
    # Uncomment this block AND the SQL_* env vars AND the dispatch-svc-db depends_on
    # entry above if your service needs its own Postgres.
    # dispatch-svc-db:
    #     image: postgres:17
    #     restart: on-failure
    #     environment:
    #         POSTGRES_USER: ${DEV_USER}
    #         POSTGRES_PASSWORD: ${DEV_PASSWORD}
    #         POSTGRES_DB: dispatch-svc
    #     volumes:
    #         - dispatch-svc-db-data:/var/lib/postgresql/data
    #     healthcheck:
    #         test: ["CMD-SHELL", "pg_isready -U ${DEV_USER} -d dispatch-svc"]
    #         interval: 5s
    #         timeout: 5s
    #         retries: 10

# --- Volumes ---
# Uncomment if you enabled the dispatch-svc-db block above:
# volumes:
#     dispatch-svc-db-data:
